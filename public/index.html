<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>F*CK! I'M 50</title>
    <meta name="description" content="F*CK! I'M 50 — the podcast." />
    <link rel="stylesheet" href="/landing.css" />
  </head>
  <body>
    <!-- Mobile composition: approved poster-style Landing page. Hidden on desktop. -->
    <div class="stage stage--mobile" aria-hidden="false">
      <div class="artboard artboard--mobile">
        <img
          class="logo"
          src="/assets/FI50-LOGO-MASTER.png"
          alt="F*CK! I'M 50"
          width="1636"
          height="955"
        />
        <img
          class="paul"
          src="/assets/Paul-Landing-Page-Hero.png"
          alt="Paul, host of F*CK! I'M 50"
          width="512"
          height="1010"
        />
        <img
          class="lines"
          src="/assets/3_white_lines.png"
          alt=""
          width="100"
          height="150"
        />
        <h1 class="headline">
          <img
            src="/assets/mobile-20years-gone.png"
            alt="Where's the last 20 years gone?"
            width="193"
            height="150"
          />
        </h1>
        <nav class="poster-nav" aria-label="Landing">
          <a class="btn btn-episodes" href="/episodes">
            <img src="/assets/episodes-button.png" alt="Episodes" width="300" height="98" />
          </a>
          <a class="btn btn-what-the" href="/what-the">
            <img src="/assets/what-the-button.png" alt="What The?" width="300" height="103" />
          </a>
          <a class="btn btn-things" href="/things-im-doing">
            <img src="/assets/things-im-doing-button.png" alt="Things I'm Doing" width="300" height="108" />
          </a>
          <a class="btn btn-merch" href="/merch">
            <img src="/assets/merch-button.png" alt="Merch" width="300" height="108" />
          </a>
          <a class="btn btn-contact" href="/contact">
            <img src="/assets/contact-button.png" alt="Contact" width="300" height="89" />
          </a>
        </nav>
      </div>
    </div>

    <!-- Desktop composition: approved Landing page. Hidden on mobile. -->
    <div class="stage stage--desktop">
      <div class="artboard artboard--desktop">
        <img
          class="logo-small"
          src="/assets/FI50-LOGO-MASTER.png"
          alt="F*CK! I'M 50"
          width="1636"
          height="955"
        />
        <nav class="text-nav" aria-label="Primary">
          <a href="/episodes">Episodes</a>
          <a href="/what-the">What The?</a>
          <a href="/things-im-doing">Things I'm Doing</a>
          <a href="/merch">Merch</a>
          <a href="/contact">Contact</a>
        </nav>
        <img
          class="paul"
          src="/assets/Paul-Landing-Page-Hero.png"
          alt="Paul, host of F*CK! I'M 50"
          width="512"
          height="1010"
        />
        <img
          class="lines"
          src="/assets/3_white_lines.png"
          alt=""
          width="100"
          height="150"
        />
        <img
          class="logo-large"
          src="/assets/FI50-LOGO-MASTER.png"
          alt=""
          width="1636"
          height="955"
        />
        <h1 class="headline">
          <img
            src="/assets/desktop-20years-gone.png"
            alt="Where's the last 20 years gone?"
            width="300"
            height="111"
          />
        </h1>
        <nav class="poster-nav" aria-label="Landing">
          <a class="btn btn-episodes" href="/episodes">
            <img src="/assets/episodes-button.png" alt="Episodes" width="300" height="98" />
          </a>
          <a class="btn btn-what-the" href="/what-the">
            <img src="/assets/what-the-button.png" alt="What The?" width="300" height="103" />
          </a>
          <a class="btn btn-things" href="/things-im-doing">
            <img src="/assets/things-im-doing-button.png" alt="Things I'm Doing" width="300" height="108" />
          </a>
          <a class="btn btn-merch" href="/merch">
            <img src="/assets/merch-button.png" alt="Merch" width="300" height="108" />
          </a>
          <a class="btn btn-contact" href="/contact">
            <img src="/assets/contact-button.png" alt="Contact" width="300" height="89" />
          </a>
        </nav>
      </div>
    </div>
  </body>
</html>
