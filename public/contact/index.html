<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>CONTACT — F*CK! I'M 50</title>
    <link rel="stylesheet" href="/internal.css" />
  </head>
  <body>
    <header class="internal-header">
      <a class="home-asterisk" href="/" aria-label="Home">
        <img
          src="/assets/ASTERISK_only-transparent.png"
          alt=""
          width="1734"
          height="2184"
        />
      </a>
      <button
        class="menu-toggle"
        type="button"
        aria-label="Menu"
        aria-expanded="false"
        aria-controls="site-menu"
      >
        <img src="/assets/Hamburger-Menu.png" alt="" width="626" height="535" />
      </button>
    </header>
    <nav id="site-menu" class="site-menu" hidden aria-label="Menu">
      <a href="/episodes/">
        <img src="/assets/episodes-button.svg" alt="Episodes" width="1032" height="337" />
      </a>
      <a href="/what-the/">
        <img src="/assets/what-the-button.svg" alt="What The?" width="1015" height="347" />
      </a>
      <a href="/things-im-doing/">
        <img
          src="/assets/things-im-doing-button.svg"
          alt="Things I'm Doing"
          width="1030"
          height="370"
        />
      </a>
      <a href="/merch/">
        <img src="/assets/merch-button.svg" alt="Merch" width="1037" height="375" />
      </a>
      <a href="/contact/">
        <img src="/assets/contact-button.svg" alt="Contact" width="862" height="255" />
      </a>
    </nav>
    <h1 class="page-title">
      <img src="/assets/Contact-Title.png" alt="Contact" />
    </h1>
    <div class="contact-success" hidden role="status" aria-live="polite">
      <p class="contact-success-kicker">MESSAGE SENT</p>
      <p class="contact-success-thanks">Thanks — I’ll get back to you.</p>
      <p class="contact-success-hint">If you're hungry for more, click the hamburger for the menu.</p>
    </div>
    <form class="contact-form" id="contact-form" novalidate>
      <label class="contact-field">
        <span class="contact-visually-hidden">Subject</span>
        <select name="subject" required>
          <option value="" disabled selected>Subject</option>
          <option value="Become a Guest">Become a Guest</option>
          <option value="General Comments">General Comments</option>
          <option value="Commercial Partnerships">Commercial Partnerships</option>
        </select>
      </label>
      <label class="contact-field">
        <span class="contact-visually-hidden">Your Name</span>
        <input type="text" name="name" placeholder="Your Name" autocomplete="name" required />
      </label>
      <label class="contact-field">
        <span class="contact-visually-hidden">Email Address</span>
        <input
          type="email"
          name="email"
          placeholder="Email Address"
          autocomplete="email"
          inputmode="email"
          required
        />
      </label>
      <div class="contact-phone">
        <label class="contact-field contact-field--dial">
          <span class="contact-visually-hidden">Country dial code</span>
          <select name="dial" required>
            <option value="" disabled selected>Code</option>
          </select>
        </label>
        <label class="contact-field contact-field--number">
          <span class="contact-visually-hidden">Phone Number</span>
          <input
            type="tel"
            name="phone"
            placeholder="Phone Number"
            autocomplete="tel-national"
            inputmode="tel"
            required
          />
        </label>
      </div>
      <label class="contact-field">
        <span class="contact-visually-hidden">Your Message</span>
        <textarea name="message" placeholder="Your Message..." rows="6" required></textarea>
      </label>
      <p class="contact-word-count" aria-live="polite">0 / 500 words</p>
      <div class="contact-hp" aria-hidden="true">
        <label>
          Website
          <input type="text" name="website" tabindex="-1" autocomplete="off" />
        </label>
      </div>
      <button class="contact-send" type="submit">SEND MESSAGE</button>
    </form>
    <p class="contact-status" hidden></p>
    <script src="/internal-menu.js" defer></script>
    <script src="/contact-form.js" defer></script>
  </body>
</html>
