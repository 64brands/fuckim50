<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="index, follow" />
    <title>EPISODES | FI50 Show</title>
    <link rel="canonical" href="https://fi50.show/episodes/" />
    <meta property="og:site_name" content="FI50 Show" />
    <meta property="og:title" content="EPISODES | FI50 Show" />
    <meta property="og:url" content="https://fi50.show/episodes/" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="/internal.css" />
    <link rel="stylesheet" href="/footer.css" />
  </head>
  <body>
    <header class="internal-header">
      <a class="home-asterisk" href="/" aria-label="Home">
        <img
          class="home-mark home-mark--mobile"
          src="/assets/ASTERISK_only-transparent.png"
          alt=""
          width="1734"
          height="2184"
        />
        <img
          class="home-mark home-mark--desktop"
          src="/assets/FI50-LOGO-MASTER.png"
          alt=""
          width="1636"
          height="955"
        />
      </a>
      <button
        class="menu-toggle"
        type="button"
        aria-label="Menu"
        aria-expanded="false"
        aria-controls="site-menu"
      >
        <img
          class="menu-mark menu-mark--mobile"
          src="/assets/Hamburger-Menu.png"
          alt=""
          width="626"
          height="535"
        />
        <img
          class="menu-mark menu-mark--desktop"
          src="/assets/Hamburger-Menu-Desktop.png"
          alt=""
          width="610"
          height="586"
        />
      </button>
    </header>
    <nav id="site-menu" class="site-menu" hidden aria-label="Menu">
      <a href="/episodes/">
        <img src="/assets/episodes-button.svg" alt="Episodes" width="1032" height="337" />
      </a>
      <a href="/what-the/">
        <img src="/assets/what-the-button.svg" alt="What The?" width="1015" height="347" />
      </a>
      <a href="/things-im-doing/">
        <img
          src="/assets/things-im-doing-button.svg"
          alt="Things I'm Doing"
          width="1030"
          height="370"
        />
      </a>
      <a href="/merch/">
        <img src="/assets/merch-button.svg" alt="Merch" width="1037" height="375" />
      </a>
      <a href="/contact/">
        <img src="/assets/contact-button.svg" alt="Contact" width="862" height="255" />
      </a>
    </nav>
    <h1 class="page-title">
      <img src="/assets/Episodes-Title.png" alt="Episodes" />
    </h1>
    <nav class="episodes-chooser" aria-label="Episode formats">
      <a href="/episodes/podcast/">
        <img
          src="/assets/podcast-episode-logo.svg"
          alt="Podcast Episodes"
          width="645"
          height="195"
        />
        <span class="episodes-chooser-note">We're now LIVE!<br />Check out the podcast here</span>
      </a>
      <div class="episodes-chooser-soon">
        <img
          src="/assets/youtube-episode-logo.svg"
          alt="YouTube Episodes"
          width="645"
          height="195"
        />
        <span class="episodes-chooser-note episodes-chooser-note--soon">COMING SOON</span>
      </div>
    </nav>
    <footer class="site-footer">
      <p class="site-footer-left">© 2026 • 64 Brands</p>
      <p class="site-footer-right">Privacy • Ts&amp;Cs</p>
    </footer>
    <script src="/internal-menu.js" defer></script>
  </body>
</html>
