<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <body>
    <header class="internal-header">
      <a class="home-asterisk" href="/" aria-label="Home">
        <img
          class="home-mark home-mark--mobile"
          src="/assets/ASTERISK_only-transparent.png"
          alt=""
          width="1734"
          height="2184"
        />
        <img

          src="/assets/FI50-LOGO-MASTER.png"
          alt=""

          height="955"
        />

      <button
        class="menu-toggle"

        aria-expanded="false"
        aria-controls="site-menu"
      >
        <img
          class="menu-mark menu-mark--mobile"
          src="/assets/Hamburger-Menu.png"
          alt=""
          width="626"
          height="535"
        />
        <img
          class="menu-mark menu-mark--desktop"
          src="/assets/Hamburger-Menu-Desktop.png"

    <nav id="site-menu" class="site-menu" hidden aria-label="Menu">
      <a href="/episodes/">
        <img src="/assets/episodes-button.svg" alt="Episodes" width="1032" height="337" />
      </a>
      <a href="/what-the/">
        <img src="/assets/what-the-button.svg" alt="What The?" width="1015" height="347" />
      </a>
      <a href="/things-im-doing/">

      <a href="/merch/">

      </a>
      <a href="/contact/">
        <img src="/assets/contact-button.svg" alt="Contact" width="862" height="255" />

    <h1 class="page-title">
      <img src="/assets/Episodes-Title.png" alt="Episodes" />
    </h1>
    <div class="episodes-list">
      <article class="episode-item episode-item--podcast">
        <img
          class="episode-brand"
          src="/assets/podcast-episode-logo-arrow.svg"
          alt="Podcast"
          width="1500"
          height="300"
        />
        <img
          class="episode-art"
          src="/assets/Paul-Burfitt-Sept26-001.jpg"
          alt=""
          width="805"
          height="888"
        />
        <div class="episode-text">
          <p class="episode-number">Episode 1.</p>
          <h2 class="episode-name">The Wakeup!</h2>
          <div class="episode-platforms">
            <img
              src="/assets/spotify-icon.svg"
              alt=""
              width="1080"
              height="1080"
            />
            <img
              src="/assets/apple-podcast-icon.svg"
              alt=""
              width="1080"
              height="1080"
            />
          </div>
        </div>
      </article>
      <hr class="episode-divider" />
      <article class="episode-item episode-item--youtube">
        <img
          class="episode-brand"
          src="/assets/youtube-episode-logo-arrow.svg"
          alt="YouTube"
          width="1500"
          height="300"
        />
        <img
          class="episode-art"
          src="/assets/YouTube-Sample-Sept26-001.png?v=14c"
          alt=""
          width="1427"
          height="1041"
        />
        <div class="episode-text">
          <p class="episode-number">Episode 1.</p>
          <h2 class="episode-name">Welcome to the party!</h2>
          <div class="episode-platforms">
            <img
              src="/assets/youtube-icon.svg"
              alt=""
              width="1080"
              height="1080"
            />
          </div>
        </div>
      </article>
      <hr class="episode-divider" />
    </div>
    <footer class="site-footer">
      <p class="site-footer-left">© 2026 • 64 Brands</p>
      <p class="site-footer-right">Privacy • Ts&amp;Cs</p>
